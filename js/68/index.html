<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wikipedia Explorer</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Wikipedia Explorer</h1><form id="setup"><label>Google Maps key <input id="maps-key" type="password" required autocomplete="off"></label><label>GeoNames username <input id="username" required autocomplete="off"></label><button>Load map</button></form><form id="search-form"><label>Search Wikipedia <input id="query" required maxlength="200"></label><button id="search-button" disabled>Search</button></form><p id="status" role="status">Enter your own credentials to load the map.</p><div id="layout"><div id="map" aria-label="Results map"></div><aside id="results" aria-label="Places"></aside></div></main><script type="module" src="index.js"></script></body></html>
